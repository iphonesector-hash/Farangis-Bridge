<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Farangis Voice Lab</title><style>:root{color-scheme:dark;--bg:#050713;--card:#10162c;--muted:#8f9abb;--text:#f6f8ff;--p:#7b6cff;--c:#44d4ff;--ok:#49d7a4;--bad:#ff6682}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#172154 0,transparent 34%),radial-gradient(circle at 90% 5%,#073650 0,transparent 30%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,sans-serif;color:var(--text);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:28px 16px 90px}.brand{text-align:center}.orb{width:104px;height:104px;border-radius:50%;margin:8px auto 18px;display:grid;place-items:center;background:linear-gradient(145deg,#161d3d,#080c1e);box-shadow:0 0 50px #44d4ff22;position:relative}.orb:before{content:'';position:absolute;inset:-7px;border:3px solid var(--p);border-top-color:var(--c);border-right-color:transparent;border-radius:50%;animation:spin 3s linear infinite}.orb.listening:before{animation-duration:.65s}.orb.speaking:before{animation-duration:1s;box-shadow:0 0 26px #44d4ff55}@keyframes spin{to{transform:rotate(360deg)}}h1{letter-spacing:8px;font-size:25px;margin:0}.credit{font-size:7px;letter-spacing:3px;color:#657094;margin-top:6px}.status{margin:18px auto 0;color:var(--muted);font-size:13px}.card{background:#0f152ccc;border:1px solid #ffffff12;border-radius:24px;padding:16px;margin-top:14px;backdrop-filter:blur(18px)}label{display:block;color:#b8c1df;font-size:11px;margin:10px 0 6px}.input,textarea{width:100%;background:#080d21;border:1px solid #293254;border-radius:14px;padding:13px;color:#fff;font-size:14px;outline:none}textarea{min-height:92px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}button{appearance:none;border:0;border-radius:15px;padding:13px 15px;font-weight:900;background:linear-gradient(135deg,var(--p),#5a51df);color:#fff}button.alt{background:#202945}button.stop{background:#9f3150}.reply{white-space:pre-wrap;line-height:1.9;font-size:15px;text-align:right;min-height:48px}.meta{font-size:10px;color:var(--muted);margin-top:8px}.tiny{font-size:10px;color:#74809f;line-height:1.7}</style></head><body><div class="wrap"><div class="brand"><div id="orb" class="orb"><b style="font-size:42px">F</b></div><h1>FARANGIS</h1><div class="credit">MADE BY SECTOR TEAM</div><div id="state" class="status">آماده تست</div></div>
<div class="card"><div class="row"><div><label>Groq API Key</label><input id="groq" class="input" type="password" placeholder="gsk_..." autocomplete="off"></div><div><label>ElevenLabs API Key</label><input id="eleven" class="input" type="password" placeholder="xi-..." autocomplete="off"></div></div><div class="row"><div><label>Voice ID</label><input id="voice" class="input" value="21m00Tcm4TlvDq8ikWAM"></div><div><label>مدل TTS</label><input id="model" class="input" value="eleven_v3"></div></div><p class="tiny">کلیدها فقط داخل مرورگر همین دستگاه ذخیره می‌شوند و در GitHub نوشته نمی‌شوند. برای تست، هر درخواست کلید را مستقیماً به هسته Vercel می‌فرستد.</p></div>
<div class="card"><label>پیام</label><textarea id="prompt" placeholder="مثلاً: سلام فرنگیس، صدای منو داری؟"></textarea><div class="row" style="margin-top:12px"><button id="send">ارسال و پخش پاسخ</button><button id="mic" class="alt">🎙 شروع صحبت</button><button id="tts" class="alt">🔊 فقط تست صدا</button></div></div>
<div class="card"><div class="meta">پاسخ فرنگیس</div><div id="reply" class="reply">هنوز پاسخی دریافت نشده.</div><div id="meta" class="meta"></div></div></div>
<script>const $=id=>document.getElementById(id);const groq=$('groq'),eleven=$('eleven'),voice=$('voice'),model=$('model'),prompt=$('prompt'),reply=$('reply'),meta=$('meta'),state=$('state'),orb=$('orb'),mic=$('mic');['groq','eleven','voice','model'].forEach(k=>{const e=$(k);e.value=localStorage.getItem('farangis_'+k)||e.value;e.addEventListener('input',()=>localStorage.setItem('farangis_'+k,e.value.trim()))});const deviceId=localStorage.getItem('farangis_voice_lab_device')||('web-'+Date.now());localStorage.setItem('farangis_voice_lab_device',deviceId);function headers(){return {'Content-Type':'application/json','x-farangis-device-id':deviceId,'x-farangis-groq-key':groq.value.trim(),'x-farangis-elevenlabs-key':eleven.value.trim(),'x-farangis-voice-id':voice.value.trim(),'x-farangis-tts-model':model.value.trim()}}function setState(s,mode=''){state.textContent=s;orb.className='orb '+mode}async function readJson(r){const t=await r.text();let d={};try{d=JSON.parse(t)}catch{d={error:t}}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}async function speak(text){if(!eleven.value.trim())throw new Error('کلید ElevenLabs را وارد کن.');setState('در حال ساخت و پخش صدای فارسی…','speaking');const r=await fetch('/api/v1/voice/tts',{method:'POST',headers:headers(),body:JSON.stringify({text})});if(!r.ok){const d=await readJson(r);throw new Error(d.error||'TTS failed')}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=new Audio(url);await a.play();await new Promise((resolve,reject)=>{a.onended=resolve;a.onerror=()=>reject(new Error('پخش فایل صوتی شکست خورد'))});URL.revokeObjectURL(url);setState('آماده','')}async function ask(text){if(!groq.value.trim())throw new Error('کلید Groq را وارد کن.');if(!text.trim())return;setState('دارم فکر می‌کنم…','');reply.textContent='…';meta.textContent='';try{const r=await fetch('/api/v1/chat',{method:'POST',headers:headers(),body:JSON.stringify({text,context:[],mode:'assistant'})});const d=await readJson(r);const out=d.text||d.message||'پاسخی دریافت نشد';reply.textContent=out;meta.textContent='Chat OK';await speak(out);meta.textContent='Chat + TTS OK'}catch(e){reply.textContent='❌ '+e.message;meta.textContent='';setState('خطا','')}}$('send').onclick=()=>ask(prompt.value).catch(e=>{reply.textContent='❌ '+e.message});$('tts').onclick=()=>speak(prompt.value.trim()||'سلام، من فرنگیس هستم. این یک تست صدای فارسی است.').catch(e=>{reply.textContent='❌ '+e.message;setState('خطا','')});function toBase64(buffer){const bytes=new Uint8Array(buffer);let binary='';const step=0x8000;for(let i=0;i<bytes.length;i+=step)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+step,bytes.length)));return btoa(binary)}let recorder=null,chunks=[];$('mic').onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!groq.value.trim()){reply.textContent='❌ اول کلید Groq را وارد کن.';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());mic.textContent='🎙 شروع صحبت';mic.className='alt';setState('در حال تبدیل صدا به متن…','');try{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});const audioBase64=toBase64(await blob.arrayBuffer());const r=await fetch('/api/v1/voice/stt',{method:'POST',headers:headers(),body:JSON.stringify({audioBase64,mimeType:blob.type||'audio/webm',fileName:'voice.webm'})});const d=await readJson(r);prompt.value=d.text||'';meta.textContent='STT OK';await ask(prompt.value)}catch(e){reply.textContent='❌ '+e.message;setState('خطا','')}};recorder.start();mic.textContent='■ پایان صحبت';mic.className='stop';setState('دارم گوش می‌دم…','listening')}catch(e){reply.textContent='❌ دسترسی میکروفن: '+e.message}};</script></body></html>
